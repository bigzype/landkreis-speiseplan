name: Portable regression tests
on:
  push:
    branches: [main]
    paths: ['**.py', 'requirements.txt', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify clean Linux runner (no installed macOS validator)
        run: test ! -e /Users/osiris/.hermes/scripts
      - run: python -m unittest discover -s tests -v
