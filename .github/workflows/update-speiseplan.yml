name: Speiseplan aktualisieren
run-name: ${{ inputs.recovery_id && format('Manual recovery {0}', inputs.recovery_id) || 'Speiseplan aktualisieren' }}

on:
  # Der Hermes-Quellenmonitor startet den Workflow erst, wenn die aktuelle
  # Wochen-PDF auf der Restaurantseite verfügbar ist.
  workflow_dispatch:
    inputs:
      recovery_id:
        type: string
        default: ""
      code_sha:
        type: string
        default: ""
      source_sha:
        type: string
        default: ""
      source_url:
        type: string
        default: ""
      target:
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: speiseplan-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Regressionstests
        run: python -m unittest discover -s tests -v

      - name: Speiseplan und Kalender aktualisieren
        if: ${{ !inputs.recovery_id }}
        run: python update_menu.py

      - name: Manuell autorisierte feste Quelle validieren und verarbeiten
        if: ${{ inputs.recovery_id != '' }}
        env:
          RECOVERY_ID: ${{ inputs.recovery_id }}
          CODE_SHA: ${{ inputs.code_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_URL: ${{ inputs.source_url }}
          TARGET: ${{ inputs.target }}
        run: python manual_recovery.py workflow-source

      - name: Änderungen veröffentlichen
        run: |
          if git diff --quiet && test -z "$(git status --porcelain)"; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Speiseplan.pdf speiseplan.ics speiseplan.txt data/ pdf/
          git commit -m "chore: Speiseplan aktualisieren"
          git push
